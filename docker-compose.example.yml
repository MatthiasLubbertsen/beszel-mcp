services:
  beszel-mcp:
    image: ghcr.io/matthiaslubbertsen/beszel-mcp:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      BESZEL_URL: http://beszel:8090
      BESZEL_TOKEN: ${BESZEL_TOKEN}      # PocketBase token (see README); or use BESZEL_EMAIL + BESZEL_PASSWORD
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN} # clients send: Authorization: Bearer <token>
